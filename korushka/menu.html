<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню — «Корюшка и сыр»</title>
<meta name="description" content="Меню ресторана «Корюшка и сыр» на Петроградской: закуски, горячее, десерты и напитки с ценами.">
<meta name="theme-color" content="#0B1410">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@view-transition{navigation:auto}
:root{--bg:#0B1410;--bg2:#13231A;--gold:#F2B66D;--cream:#F6F1E9;--muted:rgba(246,241,233,.74);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--cream);line-height:1.5;padding-bottom:96px}
.top{padding:calc(22px + env(safe-area-inset-top)) 18px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#24402F,var(--bg) 75%)}
.top a.back{position:absolute;left:12px;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);color:var(--cream);text-decoration:none;font-size:18px}
.top h1{font-family:"Playfair Display",Georgia,serif;font-size:28px;font-weight:600}
.top h1 i{color:var(--gold);font-weight:500}
.top p{color:var(--muted);font-size:13px;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.live i{width:8px;height:8px;border-radius:50%;background:#5BD38A}
.live.closed i{background:#E0745B}
nav{position:sticky;top:0;z-index:5;background:rgba(11,20,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:800;color:var(--cream);text-decoration:none;background:rgba(255,255,255,.04)}
nav a.on{background:var(--cream);border-color:var(--cream);color:var(--bg)}
main{padding:4px 14px 30px;max-width:680px;margin:0 auto}
h2{font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:600;margin:26px 4px 12px;scroll-margin-top:76px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:Manrope,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.item{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:10px}
.pic{flex:none;width:86px;height:86px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#24402F,#13231A);position:relative;overflow:hidden}
.pic svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.pic .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.body{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item h3{font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;line-height:1.25}
.price{font-weight:800;color:var(--gold);white-space:nowrap}
.item p{font-size:13px;color:var(--muted);margin-top:2px}
.item .more{font-size:12px;color:rgba(246,241,233,.66);margin-top:4px}
.tags:empty{display:none}
.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;color:#0B1410;background:#A9D8B8;border-radius:6px;padding:1px 7px}
.tag.hit{background:var(--gold)}
.off-tag{font-size:11px;font-weight:800;color:#FFD9CC;background:rgba(224,116,91,.25);border-radius:6px;padding:1px 7px}
.item.off .pic,.item.off h3,.item.off .price{opacity:.45}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 20px 20px}
footer a{color:var(--gold);display:inline-block;padding:10px 0}
.call{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(11,20,16,.8);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.call a{flex:1;min-height:48px;display:grid;place-items:center;border-radius:999px;font-weight:800;font-size:14px;text-decoration:none}
.call .main{background:linear-gradient(135deg,#9A4A22,#A9552C);color:#fff}
.call .ghost{border:1px solid var(--line);color:var(--cream)}
@media (min-width:700px){.call{left:50%;right:auto;width:420px;transform:translateX(-50%)}}
</style>
</head>

<script>

/* Фото ставится только если файл реально загрузился — без запросов 404 в консоли */
const PHOTOS=/*@PHOTOS*/[]/*@END*/; // заполняет build.py по содержимому папки img/
const PHOTO=(el,src)=>{if(!src||!PHOTOS.includes(src))return;const i=new Image();i.onload=()=>{el.style.backgroundImage=`url(${src})`;el.classList.add('has')};i.src=src;};
const fillPhotos=root=>root.querySelectorAll('[data-photo]').forEach(el=>PHOTO(el,el.dataset.photo));

/*@END-LIB*/
const nav=document.getElementById('nav'), main=document.getElementById('main');
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';
Object.entries(MENU).forEach(([cat,items],i)=>{
  const id='c'+i;
  nav.insertAdjacentHTML('beforeend',`<a href="#${id}" data-id="${id}">${cat}</a>`);
  main.insertAdjacentHTML('beforeend',`<h2 id="${id}">${cat}<small>${items.length} позиции</small></h2>`+items.map(m=>`
    <div class="item${m.on?'':' off'}">
      <div class="pic">${ART[m.art]().replace('slice','meet')}<div class="photo" data-photo="${m.img}"></div></div>
      <div class="body">
        <div class="row"><h3>${m.n}</h3><span class="price">${fmt(m.p)}</span></div>
        <p>${m.d}</p>
        <p class="more">${m.more}</p>
        <div class="tags">${m.badge?`<span class="tag hit">${m.badge}</span>`:''}${m.v?'<span class="tag">🌿 вегетарианское</span>':''}${m.on?'':'<span class="off-tag">Сегодня нет в наличии</span>'}</div>
      </div>
    </div>`).join(''));
});
const links=[...nav.children];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){links.forEach(a=>{const on=a.dataset.id===e.target.id;a.classList.toggle('on',on);if(on)nav.scrollTo({left:a.offsetLeft-14,behavior:'smooth'})})}
}),{rootMargin:'-70px 0px -70% 0px'});
document.querySelectorAll('main h2').forEach(h=>io.observe(h));
fillPhotos(main);
links[0].classList.add('on');
(function(){const el=document.getElementById('live');
  const h=+new Intl.DateTimeFormat('ru-RU',{hour:'numeric',hour12:false,timeZone:'Europe/Moscow'}).format(new Date());
  const open=h>=12&&h<23;el.querySelector('span').textContent=open?'Сейчас открыто · до 23:00':'Сейчас закрыто · откроемся в 12:00';
  if(!open)el.classList.add('closed');})();
